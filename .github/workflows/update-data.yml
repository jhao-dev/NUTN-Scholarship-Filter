name: Update scholarship data

on:
  schedule:
    - cron: "0 17 * * *"   # 每天台北時間 01:00；網站在 04:00 來取最新資料
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4 pypdf
      - name: Scrape NUTN announcements
        run: python scraper/scrape.py app.py data/scholarships.json
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholarships.json
          git diff --cached --quiet || (git commit -m "chore: 更新獎助學金資料" && git push)
